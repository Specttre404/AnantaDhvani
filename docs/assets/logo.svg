<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13161F"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Radius Rect -->
  <rect width="128" height="128" rx="32" fill="url(#bg)"/>

  <!-- Glass Ring -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Waveform -->
  <path d="M 28 64 C 35 64 40 42 50 42 C 60 42 63 86 73 86 C 83 86 87 50 95 50 C 98 50 100 64 104 64"
        fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Pulse Node -->
  <circle cx="73" cy="86" r="4.5" fill="#FFFFFF"/>
</svg>
